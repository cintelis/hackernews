# Release builds: `git tag v1.2.3 && git push origin v1.2.3` runs this via
# .github/workflows/release.yml. Pure Go (CGO off), so every target
# cross-compiles from one Linux runner.
version: 2
project_name: cintelis

before:
  hooks:
    # Windows: build the CISO AI icon and the file details (product, company,
    # version) into cintelis.exe, from winres/winres.json. Build-time only;
    # nothing is added to the program's dependencies.
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --out cmd/cintelis/rsrc --arch amd64,arm64 --product-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}.0 --file-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}.0

builds:
  - id: cintelis
    main: ./cmd/cintelis
    binary: cintelis
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  # names must match update.AssetName and the install scripts
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

# a draft: nothing is installable until the maintainer signs checksums.txt
# offline and publishes (scripts/sign-release.sh)
release:
  draft: true
  replace_existing_draft: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]
