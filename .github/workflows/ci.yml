name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, so newly published vulnerabilities surface without a push

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        # the race detector needs cgo, which the Windows runner lacks
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then go test ./...; else go test -race ./...; fi

      - name: Build
        run: go build ./cmd/cintelis

      # macOS: install the app bundle for real and check it with Apple's tools
      - name: macOS app bundle
        if: runner.os == 'macOS'
        run: |
          ./cintelis install-app
          app="$HOME/Applications/CISO AI - Hacker News.app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")" = cintelis-launcher
          test -x "$app/Contents/MacOS/cintelis-launcher"
          test -x "$app/Contents/Resources/cintelis.command"
          sips -g pixelWidth -g pixelHeight "$app/Contents/Resources/AppIcon.icns"
          ./cintelis install-app  # again: replaces the bundle cleanly
          ls "$HOME/Applications"

      - name: Known vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
