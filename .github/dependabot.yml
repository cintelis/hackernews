# Keeps Go modules and the commit-pinned Actions current; security fixes
# also arrive as PRs as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Charm's x/* packages are internals of bubbletea/lipgloss and only move
    # together with them (x/ansi 0.11 alone breaks lipgloss v1's x/cellbuf).
    # Ignoring stops routine bumps; security updates still arrive.
    ignore:
      - dependency-name: "github.com/charmbracelet/x/*"
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
